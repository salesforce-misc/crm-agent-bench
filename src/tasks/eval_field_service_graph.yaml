  # ── Schedule Management ─────────────────────────────────────────

  - id: schedule_reschedule_no_appt_num_01
    instruction: |
      You are Robert Janzen, email rjanzen@example.com.
      You want to reschedule your repair appointment for tomorrow at
      11 AM. Provide your email when asked.
      Do NOT provide an appointment number initially — wait for the
      agent to list your appointments and ask you to select one.
      When the agent lists your appointments, say "Thank you" and
      end the conversation.
    expected_actions:
      - FSA_Identify_User_Type_Based_on_Email
      - FSA_Get_Appointment_details_based_on_User_Input
    domain: field_service
    difficulty: medium
    expected_order:
      - FSA_Identify_User_Type_Based_on_Email
      - FSA_Get_Appointment_details_based_on_User_Input
    expected_args:
      FSA_Identify_User_Type_Based_on_Email:
        email: rjanzen@example.com
      FSA_Get_Appointment_details_based_on_User_Input:
        email: rjanzen@example.com
    # Agent lists Robert's appointments; at least one of his real ones appears.
    expected_response_contains:
      - "re:SA-0409|SA-0412|SA-0414|SA-0425"

  - id: schedule_reschedule_full_flow_01
    instruction: |
      You are Robert Janzen, email rjanzen@example.com.
      You want to reschedule appointment SA-0412 to 3 PM tomorrow.
      Provide your email and appointment number upfront.
      When the agent confirms the appointment has been rescheduled,
      end the conversation.
    expected_actions:
      - FSA_Identify_User_Type_Based_on_Email
      - FSA_Unschedule_Appointment
      - FSA_Get_Available_Slots_Based_on_Appointment_Number
      - FSA_Update_Arrival_Windows
      - FSA_Schedule_Appointment
    domain: field_service
    difficulty: hard
    # The full 5-step reschedule flow; ordering is the load-bearing behavior.
    expected_order:
      - FSA_Identify_User_Type_Based_on_Email
      - FSA_Unschedule_Appointment
      - FSA_Get_Available_Slots_Based_on_Appointment_Number
      - FSA_Update_Arrival_Windows
      - FSA_Schedule_Appointment
    expected_args:
      FSA_Identify_User_Type_Based_on_Email:
        email: rjanzen@example.com
      FSA_Unschedule_Appointment:
        appointment_number: SA-0412
      FSA_Schedule_Appointment:
        appointment_number: SA-0412
    expected_state:
      service_appointments:
        SA-0412:
          status: "Scheduled"
      scheduling_actions:
        _min_length: 3
    # Must not touch Robert's other appointments while rescheduling SA-0412.
    forbidden_state:
      service_appointments:
        SA-0414:
          status: "Unscheduled"

  - id: schedule_show_available_slots_01
    instruction: |
      You are Robert Janzen, email rjanzen@example.com.
      You want to reschedule appointment SA-0414 to tomorrow.
      Provide your email and appointment number upfront.
      When the agent shows available time slots for tomorrow,
      end the conversation by saying "I'll think about it, thanks."
    expected_actions:
      - FSA_Identify_User_Type_Based_on_Email
      - FSA_Unschedule_Appointment
      - FSA_Get_Available_Slots_Based_on_Appointment_Number
    domain: field_service
    difficulty: hard
    expected_order:
      - FSA_Identify_User_Type_Based_on_Email
      - FSA_Unschedule_Appointment
      - FSA_Get_Available_Slots_Based_on_Appointment_Number
    expected_args:
      FSA_Identify_User_Type_Based_on_Email:
        email: rjanzen@example.com
      FSA_Unschedule_Appointment:
        appointment_number: SA-0414
      FSA_Get_Available_Slots_Based_on_Appointment_Number:
        appointment_number: SA-0414
    expected_state:
      service_appointments:
        SA-0414:
          status: "Unscheduled"
    # Agent should surface at least one real slot from the availability list.
    expected_response_contains:
      - "re:09:00|10:00|11:00|13:00|14:00|15:00"

  - id: schedule_outside_hours_01
    instruction: |
      You are Gabe Hoskins, email ghoskins@example.com.
      You want to reschedule your appointment SA-0406 to 8 PM today.
      Provide your email and appointment number upfront.
      When the agent informs you that 8 PM is outside service hours
      and asks for a different time, end the conversation.
    expected_actions: []
    domain: field_service
    difficulty: medium
    # 8 PM is past the 6 PM (18:00) service-hours cutoff; agent must decline
    # and must NOT have unscheduled the appointment.
    expected_response_contains:
      - "re:outside|service hours|not available|6\\s*PM|business hours"
    forbidden_state:
      service_appointments:
        SA-0406:
          status: "Unscheduled"

  - id: schedule_outside_hours_weekend_01
    instruction: |
      You are Gabe Hoskins, email ghoskins@example.com.
      You want to shift your appointment SA-0406 to Saturday at 10 AM.
      Provide your email and appointment number upfront.
      When the agent informs you that Saturday is outside service hours,
      end the conversation.
    expected_actions: []
    domain: field_service
    difficulty: medium
    # Reschedule service hours are weekdays only; Saturday must be refused and
    # the appointment must remain Scheduled.
    expected_response_contains:
      - "re:Saturday|weekend|outside|service hours|Monday"
    forbidden_state:
      service_appointments:
        SA-0406:
          status: "Unscheduled"

  # ── Service Overview (Pre-Work Brief) ───────────────────────────

