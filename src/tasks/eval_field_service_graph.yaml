# Field Service Agent Benchmark — 23 tasks with stateful tools.
#
# All tasks use domain: field_service so tools read/write shared state from
# the laptop repair field service mock database.
#
# Usage:
#   python -m harness.bench_runner \
#     --tasks src/tasks/eval_field_service_graph.yaml \
#     --config src/agents/field_service_graph.yaml
#
# Grading note: beyond expected_actions (tool *names*), tasks assert
# expected_args, expected_order (subsequence), expected_response_contains
# (substring or "re:" regex over assistant turns), expected_state, and
# forbidden_state. The reschedule flows carry expected_order because their
# multi-step ordering (identify -> unschedule -> get slots -> update -> schedule)
# is the load-bearing behavior. Policy/refusal tasks reference
# src/tasks/policies/field_service_policy.md.

tasks:
  # ── FAQ ─────────────────────────────────────────────────────────

  - id: faq_walk_in_01
    instruction: |
      You are a customer. Ask the agent whether you need to book an
      appointment or can walk in for service.
      When the agent provides information about walk-in hours and
      appointment recommendations, end the conversation.
    expected_actions:
      - FSA_Knowledge_FAQ
    domain: field_service
    difficulty: easy
    # Walk-in FAQ states weekday hours 9 AM–6 PM; agent must convey real hours.
    # Allow an optional ":00" / ":mm" between the hour and AM/PM (e.g. "9:00 AM").
    expected_response_contains:
      - "re:9(:\\d{2})?\\s*AM"
      - "re:6(:\\d{2})?\\s*PM"

  - id: faq_repair_time_01
    instruction: |
      You are a customer. Ask the agent how long a typical laptop
      repair takes.
      When the agent provides the repair timeline, end the conversation.
    expected_actions:
      - FSA_Knowledge_FAQ
    domain: field_service
    difficulty: easy
    # KB answers give a "business days" repair window — agent must state it.
    expected_response_contains:
      - "re:business day"

  - id: faq_weekend_hours_01
    instruction: |
      You are a customer. Ask the agent if they offer weekend or
      after-hours service appointments.
      When the agent confirms weekend availability details, end the
      conversation.
    expected_actions:
      - FSA_Knowledge_FAQ
    domain: field_service
    difficulty: easy
    # Weekend FAQ: Saturday slots 10 AM–2 PM.
    expected_response_contains:
      - "re:Saturday"

  - id: faq_compatibility_01
    instruction: |
      You are a customer. Ask the agent if the Apple Magic Keyboard
      is compatible with MacBook Air.
      When the agent confirms compatibility, end the conversation.
    expected_actions:
      - FSA_Knowledge_FAQ
    domain: field_service
    difficulty: easy
    # Magic Keyboard IS compatible (via Bluetooth) — agent must affirm. Accept
    # the common affirmative paraphrase "works with" as well as the literal
    # "compatible"/"compatibility"; any of these is a correct confirmation.
    expected_response_contains:
      - "re:compatib|works with"

  - id: faq_magsafe_incompatible_01
    instruction: |
      You are a customer. Ask the agent if the Apple MagSafe Charger
      is compatible with MacBook Air.
      When the agent explains it is not compatible, end the conversation.
    expected_actions:
      - FSA_Knowledge_FAQ
    domain: field_service
    difficulty: easy
    # MagSafe Charger is NOT compatible with MacBook Air (needs USB-C adapter).
    # Tolerate any hyphen between "USB" and "C" — models commonly emit a
    # typographic non-breaking hyphen ("USB‑C", U+2011) instead of ASCII "-".
    expected_response_contains:
      - "re:not compatible|USB.?C|isn't compatible|incompatible"

