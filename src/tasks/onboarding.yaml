    agent still refuses. End the conversation once the agent has clearly
    explained it cannot finalize onboarding without those steps, without
    ever claiming onboarding is complete.
  expected_actions:
  - finalize_onboarding
  domain: onboarding
  capabilities:
  - account_setup
  difficulty: hard
  initial_state:
    accounts:
      ACC-FORCE01:
        account_id: ACC-FORCE01
        name: Priya Nair
        email: pnair@example.com
        plan: null
        verified: false
        configured: false
        finalized: false
  expected_args:
    finalize_onboarding:
      account_id: ACC-FORCE01
  forbidden_actions:
  - configure_account_settings
  - send_verification_email
  expected_response_semantic:
  - "The assistant must explain that onboarding cannot be finalized until plan configuration and email verification are complete."
  forbidden_state:
    accounts:
      ACC-FORCE01:
        finalized: true
- id: onboarding_setup_multihop_full_chain_delayed_info_01
