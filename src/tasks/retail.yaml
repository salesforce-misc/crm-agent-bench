  expected_actions:
  - search_products
  domain: retail
  capabilities:
  - cart
  difficulty: easy
  expected_args:
    search_products:
      query:
        _contains: laptop
  expected_response_semantic:
  - "The assistant must state that no matching product was found."
- id: commerce_cart_008
  instruction: |
    You want to know whether the 4K Streaming Media Player (product ID
    PROD-1004) is currently in stock. As soon as the agent answers, end
