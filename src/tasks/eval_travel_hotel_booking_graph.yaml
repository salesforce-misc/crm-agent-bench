# Travel Hotel Booking Agent Benchmark — 22 tasks with stateful tools.
#
# Domain: travel. Tools exercised by these tasks: search_hotels(city),
# get_hotel(hotel_id), create_hotel_booking(hotel_id, guest_name, nights),
# confirm_booking(booking_id).
#
# Seed data (see src/harness/tools/domains/travel.py):
#   HTL-1  Grand Central Hotel   New York       $220/night  5 rooms available
#   HTL-2  Riverside Inn         New York       $150/night  0 rooms (always overbooked)
#   HTL-3  Golden Gate Suites    San Francisco  $260/night  3 rooms available
#   bookings{} starts empty unless a task's initial_state seeds one.
#
# Usage:
#   python -m harness.bench_runner \
#     --tasks src/tasks/eval_travel_hotel_booking_graph.yaml \
#     --config src/agents/travel_hotel_booking_graph.yaml

tasks:
  # ── Browse (easy) ───────────────────────────────────────────────

  - id: travel_hotel_001_search_new_york
    instruction: |
      You are a traveler planning a trip. You want to see what hotels are
      available in New York. Ask the agent to search for hotels there.
      As soon as the agent names at least one hotel option in New York,
      say "thanks, that's all I needed" and end the conversation.
    expected_actions:
      - search_hotels
    domain: travel
    difficulty: easy
    expected_args:
      search_hotels:
        city: "New York"
    expected_response_contains:
      - "re:Grand Central|Riverside Inn"

  - id: travel_hotel_002_search_san_francisco
    instruction: |
      You are a traveler planning a trip. You want to see what hotels are
      available in San Francisco. Ask the agent to search for hotels there.
      As soon as the agent names the hotel option in San Francisco, say
      "great, thanks" and end the conversation.
    expected_actions:
      - search_hotels
    domain: travel
    difficulty: easy
    expected_args:
      search_hotels:
        city: "San Francisco"
    expected_response_contains:
      - "re:Golden Gate Suites"

  - id: travel_hotel_003_search_no_hotels_found
    instruction: |
      You are a traveler. You want to see what hotels are available in
      Chicago. Ask the agent to search for hotels there.
      As soon as the agent tells you there are no hotels available in
      Chicago (or none found), say "OK, thanks anyway" and end the
      conversation. Do not ask the agent to search a different city.
    expected_actions:
      - search_hotels
    domain: travel
    difficulty: easy
    # Chicago has no seeded hotels; the search must come back empty.
    expected_args:
      search_hotels:
        city: "Chicago"
    expected_response_contains:
      - "re:no hotels|none (available|found)|couldn't find|not (any|available)|no results"

  - id: travel_hotel_004_hotel_detail_htl1
    instruction: |
      You already know the hotel ID from a previous booking site: HTL-1.
      Ask the agent for that hotel's details, including its nightly price,
      before you decide whether to book. As soon as the agent gives you
      the name and price, say "got it, thanks" and end the conversation.
    expected_actions:
      - get_hotel
    domain: travel
    difficulty: easy
    expected_args:
      get_hotel:
        hotel_id: "HTL-1"
    expected_response_contains:
      - "220"

  - id: travel_hotel_005_hotel_detail_htl3
    instruction: |
      You already know the hotel ID: HTL-3. Ask the agent for that hotel's
      details, including its nightly price and how many rooms are left.
      As soon as the agent gives you the name, price, and room count, say
      "perfect, thanks" and end the conversation.
    expected_actions:
      - get_hotel
    domain: travel
    difficulty: easy
    expected_args:
      get_hotel:
        hotel_id: "HTL-3"
    expected_response_contains:
      - "260"

  # ── Booking happy path (easy) ────────────────────────────────────

  - id: travel_hotel_006_book_confirm_htl1_happy_path
    instruction: |
      You are Dana Whitfield. You want to book hotel HTL-1 for 2 nights.
      Provide your name and the number of nights when asked. Once the
      room is reserved, ask the agent to confirm the booking. As soon as
      the agent confirms the booking, say "thank you" and end the
      conversation.
    expected_actions:
      - create_hotel_booking
      - confirm_booking
    domain: travel
    difficulty: easy
    expected_order:
      - create_hotel_booking
      - confirm_booking
    expected_args:
      create_hotel_booking:
        hotel_id: "HTL-1"
        guest_name: "Dana Whitfield"
        nights: 2
    expected_state:
      bookings:
        _min_length: 1
    expected_response_contains:
      - "re:confirmed"

  - id: travel_hotel_007_book_confirm_htl3_happy_path
    instruction: |
      You are Priya Anand. You want to book hotel HTL-3 for 4 nights.
      Provide your name and the number of nights when asked. Once the
      room is reserved, ask the agent to confirm the booking. As soon as
      the agent confirms the booking, say "thank you" and end the
      conversation.
    expected_actions:
      - create_hotel_booking
      - confirm_booking
    domain: travel
    difficulty: easy
    expected_order:
      - create_hotel_booking
      - confirm_booking
    expected_args:
      create_hotel_booking:
        hotel_id: "HTL-3"
        guest_name: "Priya Anand"
        nights: 4
    expected_state:
      bookings:
        _min_length: 1
    expected_response_contains:
      - "re:confirmed"

  - id: travel_hotel_008_browse_then_book_from_list
    instruction: |
      You are Casey Nguyen. You want a hotel room in New York for 1 night,
      but you do NOT know any hotel IDs. Ask the agent to search hotels in
      New York first. Once you see the results, ask the agent to book
      whichever one actually has rooms available (do not name an ID
      yourself — let the agent pick the one with availability). Provide
      your name and 1 night when asked. Once the booking is confirmed,
      say "great, thanks" and end the conversation.
    expected_actions:
      - search_hotels
      - create_hotel_booking
      - confirm_booking
    domain: travel
    difficulty: easy
    # Of the two New York hotels, only HTL-1 has rooms available (HTL-2 has 0).
    expected_order:
      - search_hotels
      - create_hotel_booking
      - confirm_booking
    expected_args:
      create_hotel_booking:
        hotel_id: "HTL-1"
        guest_name: "Casey Nguyen"
        nights: 1
    forbidden_args:
      create_hotel_booking:
        hotel_id: "HTL-2"

  # ── Refusals, precision, out-of-scope (medium) ───────────────────

  - id: travel_hotel_009_overbook_refusal_htl2
    instruction: |
      You are Morgan Blake. You specifically want to book hotel HTL-2 for
      2 nights (you saw it online and want that exact hotel). Provide your
      name and nights when asked. When the agent tells you no rooms are
      available at HTL-2, do NOT ask to book a different hotel — just say
      "OK, I'll look elsewhere" and end the conversation.
    expected_actions:
      - create_hotel_booking
    domain: travel
    difficulty: medium
    # HTL-2 has 0 rooms available -> create_hotel_booking returns a 409.
    # The agent must not proceed to confirm a booking that never succeeded.
    expected_args:
      create_hotel_booking:
        hotel_id: "HTL-2"
    forbidden_actions:
      - confirm_booking
    expected_response_contains:
      - "re:no rooms|not available|fully booked|sold out|unavailable"

  - id: travel_hotel_010_confirm_already_confirmed
    instruction: |
      You are Elliot Park. First, book hotel HTL-3 for 3 nights and ask
      the agent to confirm the booking. Once it's confirmed, say "wait,
      can you confirm that booking again just to be safe?" and ask the
      agent to confirm the SAME booking a second time. When the agent
      tells you it's already confirmed, say "OK, got it" and end the
      conversation.
    expected_actions:
      - create_hotel_booking
      - confirm_booking
    domain: travel
    difficulty: medium
    expected_order:
      - create_hotel_booking
      - confirm_booking
    expected_state:
      bookings:
        _min_length: 1
    expected_response_contains:
      - "re:already (been )?confirmed"

  - id: travel_hotel_011_arg_precision_create_booking
    instruction: |
      You are Morgan Yee. Say: "Book me at HTL-1 for 2 nights." When
      asked for your name, say "Morgan Yee". Once the room is booked, ask
      the agent to confirm it. End the conversation once confirmed.
    expected_actions:
      - create_hotel_booking
      - confirm_booking
    domain: travel
    difficulty: medium
    # The very first create_hotel_booking call must carry the exact args —
    # no fuzzing of the hotel id, name, or night count.
    expected_args_mode: first
    expected_args:
      create_hotel_booking:
        hotel_id: "HTL-1"
        guest_name: "Morgan Yee"
        nights: 2

  - id: travel_hotel_012_out_of_scope_flight_request
    instruction: |
      You are Taylor Brooks. You want to book hotel HTL-3 for 3 nights and
      have it confirmed. Provide your name and nights when asked. After
      the hotel is confirmed, ask: "Can you also book my flight to get
      there?" When the agent tells you it can't help with flights, say
      "no worries" and end the conversation.
    expected_actions:
      - create_hotel_booking
      - confirm_booking
    domain: travel
    difficulty: medium
    expected_order:
      - create_hotel_booking
      - confirm_booking
    expected_args:
      create_hotel_booking:
        hotel_id: "HTL-3"
        guest_name: "Taylor Brooks"
        nights: 3
    forbidden_actions:
      - book_flight
      - search_flights
    expected_response_contains:
      - "re:flight"

  - id: travel_hotel_013_out_of_scope_car_request
    instruction: |
      You are Sam Ortiz. You want to book hotel HTL-1 for 1 night and have
      it confirmed. Provide your name and nights when asked. After the
      hotel is confirmed, ask: "Great, can you also rent me a car for the
      trip?" When the agent tells you it can't help with rental cars, say
      "that's fine" and end the conversation.
    expected_actions:
      - create_hotel_booking
      - confirm_booking
    domain: travel
    difficulty: medium
    expected_order:
      - create_hotel_booking
      - confirm_booking
    expected_args:
      create_hotel_booking:
        hotel_id: "HTL-1"
        guest_name: "Sam Ortiz"
        nights: 1
    forbidden_actions:
      - book_car
    expected_response_contains:
      - "re:car"

  - id: travel_hotel_014_hotel_detail_then_decline_no_rooms
    instruction: |
      You are considering booking hotel HTL-2. Ask the agent for that
      hotel's details, including how many rooms are available. When the
      agent tells you it has no rooms available, decide not to book it —
      say "never mind then" and end the conversation. Do NOT ask to book
      it anyway and do NOT ask about any other hotel.
    expected_actions:
      - get_hotel
    domain: travel
    difficulty: medium
    expected_args:
      get_hotel:
        hotel_id: "HTL-2"
    forbidden_actions:
      - create_hotel_booking
    expected_response_contains:
      - "re:no rooms|0 rooms|not available|fully booked"

  - id: travel_hotel_015_compare_two_cities
    instruction: |
      You are deciding between two destinations. Ask the agent to search
      hotels in New York, and also ask it to search hotels in San
      Francisco, so you can compare. Once the agent has shared hotel
      options for BOTH cities, say "thanks, that helps" and end the
      conversation.
    expected_actions:
      - search_hotels
      - search_hotels
    domain: travel
    difficulty: medium
    expected_response_contains:
      - "re:Grand Central|Riverside Inn"
      - "re:Golden Gate Suites"

  - id: travel_hotel_016_invalid_hotel_id_lookup
    instruction: |
      You saw a hotel ID "HTL-9" mentioned on a travel forum. Ask the
      agent for that hotel's details before you decide whether to book it.
      When the agent tells you it can't find that hotel, say "hm, must
      have been a typo, never mind" and end the conversation. Do NOT ask
      the agent to book anything.
    expected_actions:
      - get_hotel
    domain: travel
    difficulty: medium
    expected_args:
      get_hotel:
        hotel_id: "HTL-9"
    forbidden_actions:
      - create_hotel_booking
    expected_response_contains:
      - "re:not found|doesn't exist|couldn't find|no such hotel|no record"

  # ── Hard: multi-hop, collateral damage, hallucination guards ─────

  - id: travel_hotel_017_overbook_then_book_alternative
    instruction: |
      You are Jordan Blake. First, ask to book hotel HTL-2 for 2 nights.
      Provide your name and nights when asked. When told HTL-2 has no
      rooms available, ask the agent to instead book HTL-1 for the same
      2 nights, under the same name. Once that booking is made, ask the
      agent to confirm it. End the conversation once confirmed.
    expected_actions:
      - create_hotel_booking
      - create_hotel_booking
      - confirm_booking
    domain: travel
    difficulty: hard
    # Two create_hotel_booking calls happen (the failed HTL-2 attempt, then
    # the successful HTL-1 attempt), followed by exactly one confirm — in
    # that exact relative order among the listed tools.
    expected_order:
      - create_hotel_booking
      - create_hotel_booking
      - confirm_booking
    expected_order_mode: exact
    expected_args:
      create_hotel_booking:
        hotel_id: "HTL-1"
        guest_name: "Jordan Blake"
        nights: 2
    expected_state:
      hotels:
        HTL-1:
          rooms_available: 4
    expected_response_contains:
      - "re:no rooms|not available|sold out|fully booked"

  - id: travel_hotel_018_collateral_no_touch_other_guest_booking
    instruction: |
      You are Reese Campbell. You want to book hotel HTL-1 for 2 nights
      and have it confirmed. Provide your name and nights when asked.
      This is your first time talking to this agent — you have no other
      reservations. End the conversation once your booking is confirmed.
    domain: travel
    difficulty: hard
    # Seed an unrelated pending booking for a different guest at a different
    # hotel. Booking/confirming Reese's own room must not touch it.
    initial_state:
      bookings:
        BKG-SEED1:
          booking_id: "BKG-SEED1"
          type: "hotel"
          hotel_id: "HTL-3"
          guest_name: "Other Guest"
          nights: 2
          status: "Reserved"
    expected_actions:
      - create_hotel_booking
      - confirm_booking
    expected_order:
      - create_hotel_booking
      - confirm_booking
    expected_args:
      create_hotel_booking:
        hotel_id: "HTL-1"
        guest_name: "Reese Campbell"
        nights: 2
    expected_state:
      bookings:
        _min_length: 2
    forbidden_state:
      bookings:
        BKG-SEED1:
          status: "Confirmed"

  - id: travel_hotel_019_confirm_nonexistent_booking_hallucination_guard
    instruction: |
      You open with: "Can you confirm my booking, reference BKG-ZZZZZZ?"
      You have never actually booked anything with this agent — you just
      want to see if that reference is valid. If the agent says it can't
      find that booking, do NOT ask it to create a new booking — just say
      "hm, let me double check that reference and get back to you" and
      end the conversation.
    expected_actions:
      - confirm_booking
    domain: travel
    difficulty: hard
    expected_args:
      confirm_booking:
        booking_id: "BKG-ZZZZZZ"
    forbidden_actions:
      - create_hotel_booking
    expected_response_contains:
      - "re:not found|doesn't exist|no such booking|couldn't find|no record"

  - id: travel_hotel_020_ambiguous_lowest_price_available_room
    instruction: |
      You are Jamie Rivera. Say: "I want to stay in New York for 3 nights.
      I don't care which hotel it is — just book me into whichever one is
      cheapest AND actually has rooms available, and confirm it." Do NOT
      name a hotel yourself — the agent must figure out which one to
      book. Provide your name if asked. End the conversation once your
      booking is confirmed.
    expected_actions:
      - search_hotels
      - create_hotel_booking
      - confirm_booking
    domain: travel
    difficulty: hard
    # New York has two hotels: HTL-2 is cheaper ($150) but has 0 rooms; HTL-1
    # ($220) is the only one actually available. The agent must filter by
    # availability before optimizing for price, and must get this right on
    # the very first booking attempt (no trial-and-error against HTL-2).
    expected_order:
      - search_hotels
      - create_hotel_booking
      - confirm_booking
    expected_args_mode: first
    expected_args:
      create_hotel_booking:
        hotel_id: "HTL-1"
        guest_name: "Jamie Rivera"
        nights: 3
    forbidden_args:
      create_hotel_booking:
        hotel_id: "HTL-2"

  - id: travel_hotel_021_out_of_scope_full_trip_request
    instruction: |
      You are Avery Simmons. Say: "I need a full trip booked: a hotel in
      San Francisco for 5 nights, a flight to get there, and a rental car
      once I land." When asked, give your name. Insist gently once on the
      flight and the car if the agent doesn't address them ("what about
      the flight and the car?"). The agent should book only the hotel and
      decline the flight and the car. End the conversation once the hotel
      booking is confirmed and the agent has addressed the flight/car
      request (even if only to decline it).
    expected_actions:
      - create_hotel_booking
      - confirm_booking
    domain: travel
    difficulty: hard
    expected_order:
      - create_hotel_booking
      - confirm_booking
    expected_args:
      create_hotel_booking:
        hotel_id: "HTL-3"
        guest_name: "Avery Simmons"
        nights: 5
    forbidden_actions:
      - book_flight
      - book_car
      - search_flights
    expected_response_contains:
      - "re:flight|car"

  - id: travel_hotel_022_two_guests_two_hotels_no_cross_contamination
    instruction: |
      You are coordinating travel for two friends. First ask the agent to
      book hotel HTL-1 for Casey Nguyen for 2 nights and confirm it. Then,
      in the same conversation, ask the agent to book hotel HTL-3 for
      Devon Park for 3 nights and confirm that one too. Make sure both
      bookings are confirmed separately under the correct guest names and
      hotels before you end the conversation.
    expected_actions:
      - create_hotel_booking
      - create_hotel_booking
      - confirm_booking
      - confirm_booking
    domain: travel
    difficulty: hard
    # Booking Casey into HTL-1 must not affect HTL-3's inventory, and vice
    # versa — each hotel's room count should drop by exactly one, and two
    # distinct bookings must exist.
    expected_args:
      create_hotel_booking:
        hotel_id: "HTL-1"
        guest_name: "Casey Nguyen"
        nights: 2
    expected_state:
      bookings:
        _min_length: 2
      hotels:
        HTL-1:
          rooms_available: 4
        HTL-3:
          rooms_available: 2
