# Itsm Agent Smoke Test — 3 quick tasks for validation.
#
# Usage:
#   python -m harness.bench_runner \
#     --tasks src/tasks/eval_itsm_graph_smoke_test.yaml \
#     --config src/agents/itsm_ticket_ops_graph.yaml

tasks:
- id: smoke_itsm_ticket_ops_01
  instruction: 'You are an IT service desk employee. You want to know the current

    status and priority of ticket TCK-1001. Ask the agent to look it up.

    As soon as the agent tells you the status and priority, say "thanks,

    that''s all" and end the conversation.

    '
  expected_actions:
  - get_ticket
  domain: itsm
  expected_args:
    get_ticket:
      ticket_id: TCK-1001
  expected_response_contains:
  - TCK-1001
  - re:open
- id: smoke_itsm_ticket_ops_02
  instruction: 'You are the on-call dispatcher starting your shift. You want to see

    every ticket that is currently Open so you know what needs attention.

    Ask the agent to list them. Once the agent lists the open tickets,

    end the conversation.

    '
  expected_actions:
  - list_tickets
  domain: itsm
  expected_args:
    list_tickets:
      status: Open
  expected_response_contains:
  - TCK-1001
  - TCK-1004
- id: smoke_itsm_ticket_ops_03
  instruction: 'You are a team lead checking on the procurement ticket TCK-1004. You

    specifically want to know who it is currently assigned to. Ask the

    agent to check. When the agent tells you it has no owner yet, end

    the conversation.

    '
  expected_actions:
  - get_ticket
  domain: itsm
  expected_args:
    get_ticket:
      ticket_id: TCK-1004
  expected_response_contains:
  - re:unassigned|no one|not assigned|nobody|no owner
