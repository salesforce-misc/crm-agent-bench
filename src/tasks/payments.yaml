# Canonical Payments benchmark tasks.
# All tasks belong to the frozen base task set; capabilities are reporting and debugging slices.
tasks:
- id: payments_checkout_balance_active_01
  instruction: |
    You are the owner of account ACC-1001. You just want to know your
    current account balance and whether the account is in good standing.
    You are NOT trying to pay for anything right now.
    When the agent tells you your balance and status, say "thanks, that's
    all" and end the conversation.
  expected_actions:
  - get_account_balance
  domain: payments
  capabilities:
  - checkout
  difficulty: easy
  expected_args:
    get_account_balance:
      account_id: ACC-1001
  expected_response_semantic:
  - "The assistant must report that the account is active with a balance of 2,450.75 dollars."
  forbidden_actions:
  - process_payment
- id: payments_checkout_balance_active_02
  instruction: |
    You are the owner of account ACC-1002. You just want to check your
    current balance before deciding whether you can afford anything. You
    are NOT ready to make a payment yet.
    When the agent tells you your balance, say "got it, thanks" and end
    the conversation.
  expected_actions:
  - get_account_balance
  domain: payments
  capabilities:
  - checkout
  difficulty: easy
  expected_args:
    get_account_balance:
      account_id: ACC-1002
  expected_response_semantic:
  - "The assistant must report the account balance as 180 dollars."
  forbidden_actions:
  - process_payment
- id: payments_checkout_balance_frozen_01
  instruction: |
    You are the owner of account ACC-1003. You want to know your current
    balance and account status. You are NOT trying to make a payment.
    When the agent tells you your balance and status, end the conversation.
  expected_actions:
  - get_account_balance
  domain: payments
  capabilities:
  - checkout
  difficulty: easy
  expected_args:
    get_account_balance:
      account_id: ACC-1003
  expected_response_semantic:
  - "The assistant must report that the account is frozen with a balance of 9,800.50 dollars."
  forbidden_actions:
  - process_payment
- id: payments_checkout_single_payment_card_01
  instruction: |
    You want to pay $45.00 on your credit card for account ACC-1001.
    Ask the agent to process only the payment and pause after reporting
    the transaction ID, before it performs any optional follow-up action.
    At that checkpoint say "Perfect, that's all I needed for now, don't
    worry about anything else" and end the conversation immediately.
  expected_actions:
  - process_payment
  domain: payments
  capabilities:
  - checkout
  difficulty: easy
  expected_args:
    process_payment:
      amount:
        _contains: '45'
      method:
        _contains: card
  forbidden_actions:
  - send_receipt
  - award_loyalty_points
  - log_transaction
- id: payments_checkout_single_payment_bank_01
  instruction: |
    You want to pay $1200.50 via bank transfer for account ACC-1001.
    Ask the agent to process only the payment and pause after reporting
    the transaction ID, before it performs any optional follow-up action.
    At that checkpoint say "Great, stop there, I don't need anything else"
    and end the conversation immediately.
  expected_actions:
  - process_payment
  domain: payments
  capabilities:
  - checkout
  difficulty: easy
  expected_args:
    process_payment:
      amount: 1200.5
      method:
        _contains: bank
  forbidden_actions:
  - send_receipt
  - award_loyalty_points
  - log_transaction
- id: payments_checkout_loyalty_direct_01
  instruction: |
    You already completed a $100 purchase elsewhere and have receipt
    OFFLINE-1002-001. Ask the agent to credit the corresponding loyalty
    points to account ACC-1002. You do NOT want a payment processed, just
    the loyalty points credited.
    When the agent tells you how many points you earned, end the
    conversation.
  expected_actions:
  - adjust_loyalty_for_offline_purchase
  domain: payments
  capabilities:
  - checkout
  difficulty: easy
  expected_args:
    adjust_loyalty_for_offline_purchase:
      receipt_id: OFFLINE-1002-001
      account_id: ACC-1002
      amount:
        _contains: '100'
  expected_response_semantic:
  - "The assistant must report that the 100-dollar spend earned 1,000 loyalty points."
  expected_state:
    loyalty:
      ACC-1002: 1000
    offline_loyalty_adjustments:
      OFFLINE-1002-001:
        account_id: ACC-1002
        amount: 100
        points_awarded: 1000
    audit_log:
      _min_length: 1
  forbidden_actions:
  - process_payment
- id: payments_checkout_receipt_seeded_01
  instruction: |
    You already paid for something earlier and have transaction ID
    TXN-SEED01 for a $60.00 purchase on account ACC-1001. You never got a
    receipt. Ask the agent to send you a receipt for that transaction and
    amount. When the agent confirms the receipt was sent, end the
    conversation.
  expected_actions:
  - send_receipt
  domain: payments
  capabilities:
  - checkout
  difficulty: easy
  initial_state:
    transactions:
      TXN-SEED01:
        transaction_id: TXN-SEED01
        amount: 60.0
        method: card
        success: true
        receipt_sent: false
  expected_args:
    send_receipt:
      transaction_id: TXN-SEED01
      amount:
        _contains: '60'
  forbidden_actions:
  - process_payment
- id: payments_checkout_log_seeded_01
  instruction: |
    You already have a completed transaction, TXN-SEED02, on account
    ACC-1002. You want to make sure it's recorded in the audit trail.
    Ask the agent to log that transaction for auditing purposes. When the
    agent confirms it has been logged, end the conversation.
  expected_actions:
  - log_transaction
  domain: payments
  capabilities:
  - checkout
  difficulty: easy
  initial_state:
    transactions:
      TXN-SEED02:
        transaction_id: TXN-SEED02
        amount: 30.0
        method: paypal
        success: true
        receipt_sent: false
  expected_args:
    log_transaction:
      transaction_id: TXN-SEED02
  expected_state:
    audit_log:
      _min_length: 1
  forbidden_actions:
  - process_payment
- id: payments_checkout_full_chain_01
  instruction: |
    You want to pay $80.00 by credit card on account ACC-1001. You want
    the full checkout handled: payment, receipt, loyalty points, and the
    transaction logged for audit. Provide any details the agent asks for.
    When the agent confirms all of that is done and tells you your
    loyalty points earned, end the conversation.
  expected_actions:
  - process_payment
  - send_receipt
  - award_loyalty_points
  - log_transaction
  domain: payments
  capabilities:
  - checkout
  difficulty: medium
  expected_order:
  - process_payment
  - send_receipt
  - award_loyalty_points
  - log_transaction
  expected_args:
    process_payment:
      amount:
        _contains: '80'
      method:
        _contains: card
    award_loyalty_points:
      account_id: ACC-1001
      amount:
        _contains: '80'
  expected_response_semantic:
  - "The assistant must report that the 80-dollar purchase earned 800 loyalty points."
  expected_state:
    loyalty:
      ACC-1001: 800
    audit_log:
      _min_length: 1
- id: payments_checkout_full_chain_02
  instruction: |
    You want to pay $15.50 via PayPal on account ACC-1002. You want the
