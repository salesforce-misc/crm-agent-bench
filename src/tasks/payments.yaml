- id: payments_checkout_ambiguous_amount_01
  instruction: |
    Open with exactly: "Can you charge my card on account ACC-1001 for
    the usual amount?" Do NOT state a dollar amount — you are testing
    whether the agent asks for clarification instead of guessing. Only
    if the agent explicitly asks you for the amount do you say "$70.00".
    If the agent processes a payment without ever asking you for an
    amount, say "Wait, I never told you how much!" and end the
    conversation. End normally once the agent either asks for the amount
    and you provide it and it confirms the payment, or if it explains it
    needs an amount from you before it can proceed.
