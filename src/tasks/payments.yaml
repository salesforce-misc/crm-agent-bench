  expected_response_semantic:
  - "The assistant must report that the 15.50-dollar purchase earned 155 loyalty points."
  expected_state:
    loyalty:
      ACC-1002: 155
- id: payments_checkout_balance_then_pay_01
  instruction: |
    You are the owner of account ACC-1001. First ask the agent to check
