- id: create_campaign_most_engaged_01
  instruction: |
    You are Emily Carter, email emily.carter@example.com.
    You want to create a new campaign called "VIP Rewards Q2" targeting
    the most engaged customers from your "VIP Early Access Invite" campaign
    (campaign ID: MA-002). The description is "Reward top engagers with
    exclusive offers". Start date: June 1, 2025. End date: July 31, 2025.
    When asked for any of these details, provide them.
    When the agent confirms the campaign was created, end the conversation.
  expected_actions:
  - MA_Create_A_Campaign_With_Most_or_Least_Engaged_Customers
  domain: marketing
  capabilities:
  - campaign_analytics
  - campaign_creation
  difficulty: medium
  expected_args:
    MA_Create_A_Campaign_With_Most_or_Least_Engaged_Customers:
      campaignId: MA-002
      inputCampaignName: VIP Rewards Q2
      email: emily.carter@example.com
  expected_state:
    created_campaigns:
      _min_length: 1
- id: create_campaign_least_engaged_01
  instruction: |
    You are Marcus Lee, email marcus.lee@example.com.
    You want to create a re-engagement campaign called "Win Back Spring"
    targeting the least engaged customers from your "Spring Savings Blast"
    campaign (campaign ID: MA-019). Description: "Re-engage dormant users
    with personalized offers". Start date: May 15, 2025. End date: June 30, 2025.
    When asked for details, provide them.
