# Canonical Marketing benchmark tasks.
# All tasks belong to the frozen base task set; capabilities are reporting and debugging slices.
tasks:
- id: campaign_roi_01
  instruction: |
    You are Emily Carter, email emily.carter@example.com.
    You want to know the ROI of your "VIP Early Access Invite" campaign
    (campaign ID: MA-002). When asked for your email, provide it.
    When the agent provides the ROI details, end the conversation.
  expected_actions:
  - MA_Get_ROI_A_Of_Campaign
  domain: marketing
  capabilities:
  - campaign_analytics
  - campaign_creation
  difficulty: easy
  expected_args:
    MA_Get_ROI_A_Of_Campaign:
      campaignId: MA-002
      email: emily.carter@example.com
  expected_response_semantic:
  - "The assistant must report the ROI of campaign MA-002 as 155.1 percent."
- id: campaign_high_impression_01
  instruction: |
    You are James Patel, email james.patel@example.com.
    You want to know which of your campaigns has the highest impressions.
    When asked for your email, provide it.
    When the agent tells you the campaign name and impression count,
    end the conversation.
  expected_actions:
  - MA_Get_Campaign_With_High_Impression
  domain: marketing
  capabilities:
  - campaign_analytics
  - campaign_creation
  difficulty: easy
  expected_args:
    MA_Get_Campaign_With_High_Impression:
      email: james.patel@example.com
- id: campaign_least_impression_01
  instruction: |
    You are Olivia Nguyen, email olivia.nguyen@example.com.
    You want to know which of your campaigns has the least impressions.
    When asked for your email, provide it.
    When the agent provides the answer, end the conversation.
  expected_actions:
  - MA_Get_Campaign_With_Least_Impression
  domain: marketing
  capabilities:
  - campaign_analytics
  - campaign_creation
  difficulty: easy
