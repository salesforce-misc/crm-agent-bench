    agent to confirm it. End the conversation once confirmed.
  expected_actions:
  - create_hotel_booking
  - create_hotel_booking
  - confirm_booking
  domain: travel
  capabilities:
  - hotel_booking
  difficulty: hard
  expected_order:
  - create_hotel_booking
  - create_hotel_booking
  - confirm_booking
  expected_order_mode: exact
  expected_args:
    create_hotel_booking:
    - hotel_id: HTL-2
      guest_name: Jordan Blake
      nights: 2
    - hotel_id: HTL-1
      guest_name: Jordan Blake
      nights: 2
  expected_state:
    hotels:
      HTL-1:
        rooms_available: 4
  expected_response_semantic:
  - "The assistant must explain that the requested hotel has no rooms available (it is sold out)."
- id: travel_hotel_018_collateral_no_touch_other_guest_booking
  instruction: |
    You are Reese Campbell. You want to book hotel HTL-1 for 2 nights
