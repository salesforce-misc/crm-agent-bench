        booking_id: BKG-SEED1
        type: hotel
        hotel_id: HTL-3
        guest_name: Other Guest
        nights: 2
        status: Reserved
  expected_actions:
  - create_hotel_booking
  - confirm_booking
  expected_order:
  - create_hotel_booking
  - confirm_booking
  expected_args:
    create_hotel_booking:
      hotel_id: HTL-1
      guest_name: Reese Campbell
      nights: 2
  expected_state:
    bookings:
      _min_length: 2
  forbidden_state:
    bookings:
      BKG-SEED1:
        status: Confirmed
- id: travel_hotel_019_confirm_nonexistent_booking_hallucination_guard
