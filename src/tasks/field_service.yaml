      email: rjanzen@example.com
    FSA_Get_Appointment_details_based_on_User_Input:
      email: rjanzen@example.com
  expected_response_semantic:
  - "The assistant must list at least one of Robert Janzen's actual appointments: SA-0409, SA-0412, SA-0414, or SA-0425."
