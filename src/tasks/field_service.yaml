# Canonical Field Service benchmark tasks.
# All tasks belong to the frozen base task set; capabilities are reporting and debugging slices.
tasks:
- id: faq_walk_in_01
  instruction: |
    You are a customer. Ask the agent whether you need to book an
    appointment or can walk in for service.
    When the agent provides information about walk-in hours and
    appointment recommendations, end the conversation.
  expected_actions:
  - FSA_Knowledge_FAQ
  domain: field_service
  capabilities:
  - appointments
  - work_orders
  - troubleshooting
  difficulty: easy
  expected_response_semantic:
  - "The assistant must state that walk-in service begins at 9:00 AM."
  - "The assistant must state that walk-in service ends at 6:00 PM."
- id: faq_repair_time_01
  instruction: |
    You are a customer. Ask the agent how long a typical laptop
    repair takes.
    When the agent provides the repair timeline, end the conversation.
  expected_actions:
  - FSA_Knowledge_FAQ
  domain: field_service
  capabilities:
  - appointments
  - work_orders
  - troubleshooting
  difficulty: easy
  expected_response_semantic:
  - "The assistant must explain that a typical laptop repair takes a few business days (on the order of 1 to 5 business days)."
- id: faq_weekend_hours_01
  instruction: |
    You are a customer. Ask the agent if they offer weekend or
    after-hours service appointments.
    When the agent explains the weekend and after-hours policy, end the
    conversation.
  expected_actions:
  - FSA_Knowledge_FAQ
  domain: field_service
  capabilities:
  - appointments
  - work_orders
  - troubleshooting
  difficulty: easy
  expected_response_semantic:
  - "The assistant must state that weekend and after-hours service appointments are not offered."
- id: faq_compatibility_01
  instruction: |
    You are a customer. Ask the agent if the Apple Magic Keyboard
