      Node workflow:
      Handle responses from leads:
        1. Identify the lead by ID or email.
        2. Use SDR_Update_Lead_Interest to record what the lead expressed interest in.
        3. After updating interest, draft and schedule a follow-up email if appropriate.
        4. Use SDR_Schedule_Email to schedule any follow-up.

