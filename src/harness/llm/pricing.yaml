# Per-model pricing table for the "token cost per completed task" feature.
#
# Prices are USD per 1,000,000 tokens. Sourced from public provider pricing pages
# where available (OpenAI, Anthropic, Google). OpenAI GPT-5.5 / 5.6-luna / 5.6-terra
# were verified against developers.openai.com/api/docs/pricing on 2026-07-20.
# Prices for research or early-access builds without a published rate card are
# best-effort estimates based on the closest public equivalent — these are
# flagged with "# TODO verify price" and should be confirmed by a human with
# access to actual billing/rate-card data before this feature is used for real
# cost reporting.
#
# cache_read / cache_write may be null when a provider has no separate cache
# tier (or none is publicly documented) — see pricing.py `cost_usd()` for how
# null/missing cache prices are handled (null -> $0 contribution; present cache
# tokens with no defined price -> fall back to charging at `input` price).
#
# Loaded/parsed by pricing.py::load_pricing(). Bump `version` on any breaking
# restructure of this file (key renames, etc.) so callers can detect drift.
version: 1

models:
  # --- OpenAI family -------------------------------------------------------
  gpt-4.1:
    input: 2.00
    output: 8.00
    cache_read: 0.50
    cache_write: null
    effective_date: "2026-01-01"
    aliases:
      - "gpt-4.1"
      - "openai/gpt-4.1"
      # Match dated/preview deployment ids, e.g. "gpt-4.1-2026-04-14-preview".
      - "regex:^gpt-4\\.1[-.].*$"

  gpt-4o:
